<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复核队列 - Hydro Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: normal;
        }

        .header .stats {
            display: flex;
            gap: 30px;
            font-size: 14px;
        }

        .header .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header .stat-number {
            font-size: 24px;
            font-weight: bold;
        }

        .header .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .toolbar {
            padding: 20px 30px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .toolbar button {
            padding: 8px 16px;
            border: 1px solid #cbd5e0;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .toolbar button:hover {
            background: #f7fafc;
        }

        .toolbar button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .content {
            padding: 30px;
        }

        .review-table {
            width: 100%;
            border-collapse: collapse;
        }

        .review-table thead {
            background: #f7fafc;
        }

        .review-table th {
            text-align: left;
            padding: 15px;
            font-weight: bold;
            color: #4a5568;
            border-bottom: 2px solid #e2e8f0;
        }

        .review-table td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            color: #2d3748;
        }

        .review-table tbody tr {
            cursor: pointer;
            transition: background 0.2s;
        }

        .review-table tbody tr:hover {
            background: #f7fafc;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-open {
            background: #bee3f8;
            color: #2c5282;
        }

        .badge-high {
            background: #fed7d7;
            color: #742a2a;
        }

        .badge-medium {
            background: #feebc8;
            color: #7c2d12;
        }

        .badge-low {
            background: #c6f6d5;
            color: #22543d;
        }

        .value-highlight {
            font-weight: bold;
            color: #667eea;
            font-size: 16px;
        }

        .issue-count {
            background: #fff5f5;
            color: #c53030;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .pagination button {
            padding: 8px 16px;
            border: 1px solid #cbd5e0;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .pagination button:hover:not(:disabled) {
            background: #f7fafc;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .page-info {
            color: #666;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-review {
            background: #667eea;
            color: white;
        }

        .btn-review:hover {
            background: #5568d3;
        }

        .btn-batch {
            background: #48bb78;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-batch:hover {
            background: #38a169;
        }

        .btn-batch:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .batch-toolbar {
            background: #f7fafc;
            padding: 15px 30px;
            border-bottom: 1px solid #e2e8f0;
            display: none;
            align-items: center;
            gap: 15px;
        }

        .batch-toolbar.active {
            display: flex;
        }

        .batch-toolbar .count {
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 复核队列</h1>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalCount">-</div>
                    <div class="stat-label">待复核</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="highPriorityCount">-</div>
                    <div class="stat-label">高优先级</div>
                </div>
            </div>
        </div>

        <div class="toolbar">
            <span style="color: #666;">筛选:</span>
            <button class="active" onclick="filterByStatus('all')">全部</button>
            <button onclick="filterByStatus('open')">待处理</button>
            <button onclick="filterByStatus('high')">高优先级</button>
            <button onclick="refreshList()" style="margin-left: auto;">🔄 刷新</button>
        </div>

        <div class="batch-toolbar" id="batchToolbar">
            <span>已选择 <span class="count" id="selectedCount">0</span> 项</span>
            <button class="btn-batch" onclick="batchApprove()">批量批准</button>
            <button class="btn-batch" onclick="batchReject()">批量驳回</button>
            <button class="btn-batch" onclick="clearSelection()" style="background: #e2e8f0; color: #4a5568;">取消选择</button>
        </div>

        <div class="content" id="content">
            <div class="loading">加载中...</div>
        </div>

        <div class="pagination" id="pagination" style="display: none;">
            <button onclick="prevPage()" id="btnPrev">上一页</button>
            <span class="page-info" id="pageInfo">-</span>
            <button onclick="nextPage()" id="btnNext">下一页</button>
        </div>
    </div>

    <script>
        let currentPage = 0;
        let pageSize = 20;
        let currentFilter = 'all';
        let reviewItems = [];
        let selectedItems = new Set();

        // 页面加载时获取列表
        window.addEventListener('DOMContentLoaded', () => {
            loadReviewList();
        });

        // 加载复核列表
        async function loadReviewList() {
            try {
                const status = currentFilter === 'all' ? null : currentFilter;
                const result = await pywebview.api.list_review_items(status, pageSize, currentPage * pageSize);

                reviewItems = result.items || [];
                renderReviewList(reviewItems);
                updateStats(result);
                updatePagination(result);
            } catch (error) {
                showError('加载失败: ' + error.message);
            }
        }

        // 渲染复核列表
        function renderReviewList(items) {
            const content = document.getElementById('content');

            if (items.length === 0) {
                content.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📭</div>
                        <div>暂无待复核项</div>
                    </div>
                `;
                return;
            }

            const html = `
                <table class="review-table">
                    <thead>
                        <tr>
                            <th width="40"><input type="checkbox" class="checkbox" onchange="toggleSelectAll(this)"></th>
                            <th width="80">ID</th>
                            <th>电站</th>
                            <th width="100">年份</th>
                            <th width="150">发电量</th>
                            <th width="120">问题数</th>
                            <th width="100">优先级</th>
                            <th width="180">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${items.map(item => renderReviewRow(item)).join('')}
                    </tbody>
                </table>
            `;

            content.innerHTML = html;
        }

        // 渲染单行
        function renderReviewRow(item) {
            const issueCount = (item.validation_issues || []).length;
            const severity = item.severity || 'low';
            const checked = selectedItems.has(item.id) ? 'checked' : '';

            return `
                <tr onclick="viewReview(${item.id}, event)">
                    <td onclick="event.stopPropagation()">
                        <input type="checkbox" class="checkbox" ${checked} onchange="toggleSelect(${item.id}, this.checked)">
                    </td>
                    <td>${item.id}</td>
                    <td>
                        <div style="font-weight: bold;">${item.canonical_name || item.entity_id}</div>
                        <div style="font-size: 12px; color: #999;">${item.country || 'N/A'}</div>
                    </td>
                    <td>${item.period_label}</td>
                    <td><span class="value-highlight">${item.generation_gwh} GWh</span></td>
                    <td>
                        ${issueCount > 0 ? `<span class="issue-count">${issueCount} 个问题</span>` : '无问题'}
                    </td>
                    <td><span class="badge badge-${severity}">${severity.toUpperCase()}</span></td>
                    <td onclick="event.stopPropagation()">
                        <div class="action-buttons">
                            <button class="btn-sm btn-review" onclick="viewReview(${item.id}, event)">查看复核</button>
                        </div>
                    </td>
                </tr>
            `;
        }

        // 查看复核详情
        function viewReview(recordId, event) {
            if (event) event.stopPropagation();

            // 打开复核窗口
            pywebview.api.open_review_window(recordId);
        }

        // 更新统计信息
        function updateStats(result) {
            document.getElementById('totalCount').textContent = result.total || 0;
            document.getElementById('highPriorityCount').textContent = result.high_priority || 0;
        }

        // 更新分页信息
        function updatePagination(result) {
            const pagination = document.getElementById('pagination');
            const total = result.total || 0;
            const start = currentPage * pageSize + 1;
            const end = Math.min((currentPage + 1) * pageSize, total);

            if (total > pageSize) {
                pagination.style.display = 'flex';
                document.getElementById('pageInfo').textContent = `${start}-${end} / ${total}`;
                document.getElementById('btnPrev').disabled = currentPage === 0;
                document.getElementById('btnNext').disabled = end >= total;
            } else {
                pagination.style.display = 'none';
            }
        }

        // 筛选
        function filterByStatus(status) {
            currentFilter = status;
            currentPage = 0;
            loadReviewList();

            // 更新按钮状态
            document.querySelectorAll('.toolbar button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // 刷新列表
        function refreshList() {
            clearSelection();
            loadReviewList();
        }

        // 上一页
        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                loadReviewList();
            }
        }

        // 下一页
        function nextPage() {
            currentPage++;
            loadReviewList();
        }

        // 切换选择
        function toggleSelect(id, checked) {
            if (checked) {
                selectedItems.add(id);
            } else {
                selectedItems.delete(id);
            }
            updateBatchToolbar();
        }

        // 全选/取消全选
        function toggleSelectAll(checkbox) {
            const checkboxes = document.querySelectorAll('tbody .checkbox');
            checkboxes.forEach(cb => {
                const row = cb.closest('tr');
                const id = parseInt(row.querySelector('td:nth-child(2)').textContent);
                cb.checked = checkbox.checked;
                toggleSelect(id, checkbox.checked);
            });
        }

        // 更新批量操作工具栏
        function updateBatchToolbar() {
            const toolbar = document.getElementById('batchToolbar');
            const count = selectedItems.size;

            document.getElementById('selectedCount').textContent = count;

            if (count > 0) {
                toolbar.classList.add('active');
            } else {
                toolbar.classList.remove('active');
            }
        }

        // 清除选择
        function clearSelection() {
            selectedItems.clear();
            document.querySelectorAll('.checkbox').forEach(cb => cb.checked = false);
            updateBatchToolbar();
        }

        // 批量批准
        async function batchApprove() {
            if (selectedItems.size === 0) return;

            if (!confirm(`确认批准 ${selectedItems.size} 个复核项？`)) return;

            try {
                const ids = Array.from(selectedItems);
                const result = await pywebview.api.batch_approve(ids);

                alert(`批量批准完成：成功 ${result.success} 个，失败 ${result.failed} 个`);
                clearSelection();
                refreshList();
            } catch (error) {
                alert('操作失败: ' + error.message);
            }
        }

        // 批量驳回
        async function batchReject() {
            if (selectedItems.size === 0) return;

            const reason = prompt('请输入驳回理由:');
            if (!reason) return;

            if (!confirm(`确认驳回 ${selectedItems.size} 个复核项？`)) return;

            try {
                const ids = Array.from(selectedItems);
                const result = await pywebview.api.batch_reject(ids, reason);

                alert(`批量驳回完成：成功 ${result.success} 个，失败 ${result.failed} 个`);
                clearSelection();
                refreshList();
            } catch (error) {
                alert('操作失败: ' + error.message);
            }
        }

        // 显示错误
        function showError(message) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div style="color: #c53030; padding: 20px; text-align: center;">
                    ${message}
                </div>
            `;
        }

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    refreshList();
                }
            }
        });
    </script>
</body>
</html>
