<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#f5b76c;font-family:"Microsoft YaHei",sans-serif}.poster{width:100vw;height:100vh;position:relative;overflow:hidden;background:linear-gradient(#f6c174 0%,#f28f68 48%,#315e72 49%,#163d53 100%)}svg{width:100%;height:100%;display:block}.caption{position:absolute;left:6vw;top:6vh;color:#fff4d2;text-shadow:0 3px 0 #b45b55;z-index:3}.caption h1{margin:0;font:800 clamp(32px,6vw,80px)/1 Georgia,serif;letter-spacing:.08em}.caption p{margin:.5em 0;font-size:clamp(12px,1.6vw,20px);font-weight:700;letter-spacing:.35em}.cloud{animation:cloud 24s linear infinite}.cloud2{animation:cloud 31s linear infinite reverse}.ride{animation:bob .55s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}.pedal{animation:spin .65s linear infinite;transform-box:fill-box;transform-origin:center}.leg1{animation:leg1 .65s ease-in-out infinite alternate;transform-origin:50% 30%}.leg2{animation:leg2 .65s ease-in-out infinite alternate;transform-origin:50% 30%}.flag{animation:flag .8s ease-in-out infinite alternate;transform-origin:left center}.dash{animation:dash 1.5s linear infinite}.spark{animation:twinkle 1.8s ease-in-out infinite alternate}.spark:nth-child(2){animation-delay:-.8s}.spark:nth-child(3){animation-delay:-1.2s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{to{transform:translateY(-7px)}}@keyframes leg1{to{transform:rotate(18deg)}}@keyframes leg2{to{transform:rotate(-18deg)}}@keyframes flag{to{transform:skewY(8deg)}}@keyframes cloud{to{transform:translateX(180px)}}@keyframes dash{to{transform:translateX(-260px)}}@keyframes twinkle{to{opacity:.2;transform:scale(.55)}}@media(max-width:650px){.caption{top:4vh;left:6vw}.caption p{letter-spacing:.15em}.ride{transform:translate(-80px,40px) scale(1.1)}@keyframes bob{to{transform:translate(-80px,34px) scale(1.1)}}}
</style></head>
