<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>三峡电站2020年发电量创世界纪录</title>
</head>
<body>
    <h1>三峡水电站2020年发电量突破纪录</h1>
    <p>
        据中国长江三峡集团有限公司披露，三峡水电站2020年全年总发电量达到
        1118亿千瓦时，创单座水电站年发电量世界新纪录。
    </p>
    <table>
        <caption>三峡电站近年年度总发电量</caption>
        <thead>
            <tr><th>年份</th><th>总发电量（亿千瓦时）</th></tr>
        </thead>
        <tbody>
            <tr><td>2018</td><td>1015</td></tr>
            <tr><td>2019</td><td>968.8</td></tr>
            <tr><td>2020</td><td>1118</td></tr>
        </tbody>
    </table>
    <p>装机容量2250万千瓦，为世界最大水电站。</p>
</body>
</html>
